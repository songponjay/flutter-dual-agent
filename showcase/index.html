<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flutter Dual Agent Showcase</title>
  <style>
    body {
      margin: 0;
      font-family: "Sarabun", sans-serif;
      background: #eef6fc;
      color: #1b1d22;
    }
    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    header h1 {
      margin: 0;
      font-size: 2.4rem;
      color: #02569b;
    }
    header p {
      margin: 8px 0 0;
      color: #33475b;
      line-height: 1.6;
    }
    .lessons {
      display: grid;
      gap: 16px;
    }
    .card {
      border-radius: 16px;
      border: 1px solid rgba(2, 86, 155, 0.16);
      background: #ffffff;
      box-shadow: 0 16px 32px rgba(2, 86, 155, 0.08);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #02569b;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      gap: 12px;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #032f55;
      margin: 0;
    }
    .card-meta {
      color: #556a82;
      display: grid;
      gap: 4px;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .status {
      font-size: 1.2rem;
    }
    .details {
      display: none;
      padding: 0 24px 20px;
      color: #2f3b4c;
      line-height: 1.75;
      background: #f6fbff;
    }
    .details.visible {
      display: block;
    }
    .detail-row {
      margin: 12px 0 0;
    }
    .detail-label {
      font-weight: 700;
      color: #02569b;
    }
    .section-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #02569b;
      margin: 40px 0 16px;
    }
    .quiz-card {
      border-radius: 16px;
      border: 1px solid rgba(2, 86, 155, 0.16);
      background: #ffffff;
      box-shadow: 0 16px 32px rgba(2, 86, 155, 0.08);
      padding: 20px 24px;
      margin-bottom: 12px;
    }
    .quiz-module {
      font-size: 0.85rem;
      font-weight: 700;
      color: #02569b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .quiz-question {
      font-size: 1rem;
      font-weight: 700;
      color: #032f55;
      margin-bottom: 12px;
    }
    .quiz-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 6px;
      font-size: 0.92rem;
    }
    .quiz-label {
      font-weight: 700;
      min-width: 110px;
      color: #556a82;
    }
    .quiz-answer { color: #1b1d22; }
    .quiz-correct { color: #1a7f37; }
    .quiz-wrong { color: #cf222e; }
    .quiz-explain {
      margin-top: 10px;
      padding: 10px 14px;
      background: #f0f7ff;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #2f3b4c;
      line-height: 1.6;
    }
    .quiz-note {
      margin-top: 6px;
      font-size: 0.85rem;
      color: #856404;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Flutter Lesson Showcase</h1>
      <p>สรุปสถานะการเรียนรู้ของบทเรียน Flutter พร้อมสถานะ pass/fail/pending</p>
    </header>

    <div class="lessons" id="lessonList"></div>

    <h2 class="section-title">Quiz Log — คำถาม / คำตอบ / เฉลย</h2>
    <div id="quizList"></div>
  </div>

  <script>
    const lessons = [
      {
        title: "Module 1: Clean Architecture Scaffold",
        date: "2026-05-19",
        score: "1/2",
        status: "pass",
        concept: "แยก Data/Domain/Presentation, entity, abstract repository",
        notes: [
          "Domain layer ห้าม import Flutter หรือ package ภายนอกเด็ดขาด",
          "Entity คือ pure Dart class ไม่มี toJson() — Model ทำหน้าที่นี้",
          "Repository ใน Domain = abstract class (เหมือน interface ใน B4A)",
          "RepositoryImpl ใน Data = คลาสที่ implement จริง"
        ]
      },
      {
        title: "Module 2: Riverpod AsyncNotifier",
        date: "2026-05-21",
        score: "1/2",
        status: "pass",
        concept: "AsyncNotifier จัดการ state ทุก screen พร้อมกัน — เหมือน B4A ที่ทุกหน้าดึงข้อมูลจากที่เดียวกัน",
        notes: [
          "ref.watch() ใช้ใน build() เท่านั้น — ถ้าใช้ใน onPressed จะ crash",
          "ref.read() ใช้ใน action เช่น addLog(), deleteLog()",
          "AsyncValue มี 3 state: loading / error / data — ต้องจัดการครบ",
          "ref.invalidateSelf() = บอกให้ build() รันใหม่ ทุก screen อัปเดต",
          "@riverpod (ตัวเล็ก) = autoDispose อัตโนมัติ ไม่มี memory leak",
          "ProviderScope ต้องครอบ runApp() เสมอ — ไม่งั้น ref.watch() crash"
        ]
      },
      {
        title: "Module 3: SQLite Offline Cache",
        date: "2026-05-25",
        score: "1/2",
        status: "pass",
        concept: "sqflite, WorkLogModel toMap/fromMap, sqflite_ffi สำหรับ Windows",
        notes: [
          "Database เปิดครั้งเดียวด้วย static + ??= ป้องกันเปิดซ้ำ",
          "ลืม sqfliteFfiInit() บน Windows → crash ทันที",
          "tags เป็น List<String> ต้อง join(',') ก่อน save และ split(',') ตอน read"
        ]
      },
      {
        title: "Module 4: REST API + Error Handling + Retry",
        date: "2026-05-26",
        score: "1/2",
        status: "pass",
        concept: "Dio, interceptors, retry logic, Failure sealed class",
        notes: [
          "Dio interceptors = middleware — ใส่ logic ได้โดยไม่แก้ทุก request",
          "Repository: API first, fallback to local เมื่อ offline",
          "Retry logic ใช้ exponential backoff — delay เพิ่มขึ้นทุก attempt",
          "API key ต้องใช้ flutter_dotenv ไม่ hardcode ใน source"
        ]
      },
      {
        title: "Module 5: AI Summary Integration",
        date: "2026-05-27",
        score: "1/2",
        status: "pass",
        concept: "Strategy Pattern ผ่าน abstract class, Gemini API, สลับ provider ด้วย Riverpod",
        notes: [
          "AiSummaryService (abstract) อยู่ใน domain — ไม่รู้จัก Dio หรือ package ใดๆ",
          "Implementation (Claude/Gemini) อยู่ใน data layer",
          "Riverpod provider ตัวเดียว watch enum แล้ว return implementation ที่ถูก",
          "HTTP 429 = rate limit ชั่วคราว — ควร retry with backoff ไม่ใช่ error ทันที"
        ]
      },
      {
        title: "Module 6: Dynamic Excel Export",
        date: "",
        score: "",
        status: "pending",
        concept: "File I/O, dynamic columns, share_plus"
      },
      {
        title: "Module 7: Auth Mock → Firebase",
        date: "",
        score: "",
        status: "pending",
        concept: "MockAuthRepository, GoRouter redirect, Firebase swap"
      },
      {
        title: "Module 8: Dark/Light Mode + Portfolio Polish",
        date: "",
        score: "",
        status: "pending",
        concept: "ThemeData, empty/error states, offline banner"
      }
    ];

    const statusIcon = {
      pass: "✅",
      fail: "❌",
      pending: "⬜"
    };

    const quizLog = [
      {
        module: "Module 5 — AI Summary Integration",
        question: "ทำไม AiSummaryService ถึงต้องอยู่ใน domain layer แทนที่จะอยู่ใน data layer?",
        answered: "B",
        correct: "B",
        pass: true,
        explain: "domain layer ไม่ขึ้นกับ package ภายนอก — ถ้าวันหลังเปลี่ยนจาก Gemini เป็น OpenAI ไม่ต้องแก้ domain เลย"
      },
      {
        module: "Module 5 — AI Summary Integration",
        question: "ถ้า Gemini API ตอบกลับ HTTP 429 (rate limit) app ควรทำอะไร?",
        answered: "A — แสดง error message ทันที",
        correct: "B — retry อัตโนมัติหลัง delay แล้วค่อยแสดง error ถ้าหมด max attempts",
        pass: false,
        note: "ไม่นับผิด — ยังไม่ได้สอนเรื่อง 429 ก่อนถาม",
        explain: "429 = ส่ง request เร็วเกินไปชั่วคราว ไม่ใช่ quota หมดถาวร — wait 1-2 วิแล้ว retry มักผ่านเลย"
      }
    ];

    const quizList = document.getElementById("quizList");
    quizLog.forEach((q) => {
      const card = document.createElement("div");
      card.className = "quiz-card";
      card.innerHTML = `
        <div class="quiz-module">${q.module}</div>
        <div class="quiz-question">${q.question}</div>
        <div class="quiz-row">
          <span class="quiz-label">คำตอบที่ตอบ:</span>
          <span class="quiz-answer ${q.pass ? 'quiz-correct' : 'quiz-wrong'}">${q.answered} ${q.pass ? '✅' : '❌'}</span>
        </div>
        <div class="quiz-row">
          <span class="quiz-label">เฉลย:</span>
          <span class="quiz-correct">${q.correct}</span>
        </div>
        ${q.note ? `<div class="quiz-note">* ${q.note}</div>` : ''}
        <div class="quiz-explain">${q.explain}</div>
      `;
      quizList.appendChild(card);
    });

    const lessonList = document.getElementById("lessonList");

    lessons.forEach((lesson, index) => {
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <div class="card-header">
          <div>
            <p class="status">${statusIcon[lesson.status] || "⬜"} ${lesson.status.toUpperCase()}</p>
            <h2 class="card-title">${lesson.title}</h2>
          </div>
          <div class="card-meta">
            <span>วันที่: ${lesson.date || "ยังไม่ได้กำหนด"}</span>
            <span>คะแนน: ${lesson.score || "-"}</span>
          </div>
        </div>
        <div class="details" id="details-${index}">
          <div class="detail-row"><span class="detail-label">Concept:</span> ${lesson.concept}</div>
          ${lesson.notes ? `<div class="detail-row"><span class="detail-label">จุดสำคัญ:</span><ul style="margin:8px 0 0;padding-left:20px;">${lesson.notes.map(n => `<li>${n}</li>`).join('')}</ul></div>` : ''}
        </div>
      `;

      card.addEventListener("click", () => {
        const detail = document.getElementById(`details-${index}`);
        detail.classList.toggle("visible");
      });

      lessonList.appendChild(card);
    });
  </script>
</body>
</html>
